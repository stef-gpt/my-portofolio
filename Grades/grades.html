<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0a">
<title>Grades</title>
<style>
  :root {
    --bg: #0a0a0a;
    --card: #12150f;
    --line: rgba(255, 255, 255, .1);
    --text: #f2f4ee;
    --muted: #9da394;
    --lime: #a6ff00;
    --bad: #ff6b5e;
    --warn: #ffc247;
    --ok: #a6ff00;
    --r: 22px;
  }
  * { box-sizing: border-box; margin: 0; }
  html { color-scheme: dark; }
  body {
    min-height: 100vh; color: var(--text);
    font-family: "Outfit", system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background:
      radial-gradient(700px 420px at 90% -5%, rgba(166, 255, 0, .16), transparent 65%),
      radial-gradient(600px 400px at -5% 105%, rgba(31, 232, 180, .1), transparent 65%),
      var(--bg);
    padding: clamp(18px, 4vw, 48px) clamp(16px, 4vw, 40px) calc(40px + env(safe-area-inset-bottom, 0px));
    -webkit-font-smoothing: antialiased;
  }
  .app { max-width: 980px; margin: 0 auto; }
  header { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 26px; flex-wrap: wrap; }
  h1 { font-size: clamp(34px, 6vw, 56px); font-weight: 800; letter-spacing: -.04em; line-height: 1; }
  h1 span { color: var(--lime); }
  .sub { color: var(--muted); margin-top: 8px; font-size: 15px; }
  .ghost-btn {
    border: 1px solid var(--line); background: transparent; color: var(--muted);
    padding: 10px 16px; border-radius: 999px; font: inherit; font-size: 14px; cursor: pointer;
    transition: color .2s, border-color .2s;
  }
  .ghost-btn:hover { color: var(--bad); border-color: var(--bad); }

  .grid { display: grid; grid-template-columns: 340px minmax(0, 1fr); gap: 20px; align-items: start; }
  .panel { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 22px; }
  .panel h2 { font-size: 16px; font-weight: 600; letter-spacing: -.01em; margin-bottom: 16px; }

  /* summary */
  .summary { display: grid; grid-template-columns: 150px 1fr; gap: 22px; align-items: center; margin-bottom: 20px; }
  .ring { position: relative; width: 150px; height: 150px; }
  .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .ring circle { fill: none; stroke-width: 11; stroke-linecap: round; }
  .ring .track { stroke: rgba(255, 255, 255, .08); }
  .ring .bar { stroke: var(--lime); stroke-dasharray: 327; stroke-dashoffset: 327; transition: stroke-dashoffset .8s cubic-bezier(.2, .8, .2, 1), stroke .3s; }
  .ring-text { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
  .ring-text b { font-size: 36px; font-weight: 800; letter-spacing: -.04em; line-height: 1; }
  .ring-text span { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .stat { background: rgba(255, 255, 255, .04); border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px; min-width: 0; }
  .stat small { display: block; color: var(--muted); font-size: 12px; margin-bottom: 4px; }
  .stat b { font-size: 20px; font-weight: 700; letter-spacing: -.02em; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* form */
  form { display: grid; gap: 14px; }
  label { display: grid; gap: 7px; font-size: 13px; color: var(--muted); }
  input {
    width: 100%; background: rgba(255, 255, 255, .05); border: 1px solid var(--line); color: var(--text);
    border-radius: 14px; padding: 13px 14px; font: inherit; font-size: 16px; outline: none;
    transition: border-color .2s, background .2s;
  }
  input:focus { border-color: var(--lime); background: rgba(166, 255, 0, .06); }
  input.bad { border-color: var(--bad); }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .btn {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    border: 0; cursor: pointer; font: inherit; font-weight: 600; font-size: 16px; color: #0a0a0a;
    background: linear-gradient(180deg, #c8ff4d, #a6ff00); padding: 6px 6px 6px 24px; border-radius: 999px;
    transition: transform .25s, box-shadow .25s;
  }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(166, 255, 0, .25); }
  .btn i { width: 40px; height: 40px; border-radius: 50%; background: #0a0a0a; color: var(--lime); display: grid; place-items: center; font-style: normal; font-size: 20px; }
  .msg { min-height: 18px; font-size: 13px; color: var(--bad); }
  .cancel { display: none; background: none; border: 0; color: var(--muted); font: inherit; font-size: 13px; cursor: pointer; text-align: center; text-decoration: underline; text-underline-offset: 3px; }
  .editing .cancel { display: block; }

  /* list */
  .list { display: grid; gap: 10px; }
  .item {
    display: grid; grid-template-columns: 52px minmax(0, 1fr) auto; gap: 14px; align-items: center;
    background: rgba(255, 255, 255, .03); border: 1px solid var(--line); border-radius: 18px; padding: 12px 14px;
    animation: pop .35s cubic-bezier(.2, .8, .2, 1);
  }
  @keyframes pop { from { opacity: 0; transform: translateY(10px) scale(.98); } }
  .letter { width: 52px; height: 52px; border-radius: 16px; display: grid; place-items: center; font-weight: 800; font-size: 22px; background: rgba(166, 255, 0, .12); color: var(--lime); }
  .letter.warn { background: rgba(255, 194, 71, .12); color: var(--warn); }
  .letter.bad { background: rgba(255, 107, 94, .12); color: var(--bad); }
  .meta { min-width: 0; }
  .meta b { display: block; font-size: 17px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .meta small { color: var(--muted); font-size: 13px; }
  .barline { height: 5px; border-radius: 5px; background: rgba(255, 255, 255, .08); margin-top: 8px; overflow: hidden; }
  .barline i { display: block; height: 100%; border-radius: 5px; background: var(--lime); }
  .barline i.warn { background: var(--warn); }
  .barline i.bad { background: var(--bad); }
  .side { display: flex; align-items: center; gap: 6px; }
  .score { font-size: 22px; font-weight: 700; letter-spacing: -.03em; margin-right: 6px; }
  .icon-btn { width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line); background: transparent; color: var(--muted); cursor: pointer; display: grid; place-items: center; transition: color .2s, border-color .2s, background .2s; }
  .icon-btn:hover { color: var(--lime); border-color: var(--lime); }
  .icon-btn.del:hover { color: var(--bad); border-color: var(--bad); }
  .icon-btn svg { width: 16px; height: 16px; }
  .empty { text-align: center; color: var(--muted); padding: 40px 10px; border: 1px dashed var(--line); border-radius: 18px; font-size: 15px; }
  .list-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; gap: 10px; }
  .list-head h2 { margin: 0; }
  select { background: rgba(255, 255, 255, .05); border: 1px solid var(--line); color: var(--text); border-radius: 999px; padding: 8px 12px; font: inherit; font-size: 13px; outline: none; }
  select option { background: #12150f; }

  @media (max-width: 860px) {
    .grid { grid-template-columns: 1fr; }
  }
  @media (max-width: 480px) {
    .summary { grid-template-columns: 1fr; justify-items: center; }
    .stats { width: 100%; }
    .item { grid-template-columns: 46px minmax(0, 1fr) auto; gap: 10px; padding: 10px; }
    .letter { width: 46px; height: 46px; font-size: 19px; }
    .score { font-size: 19px; margin-right: 2px; }
    .icon-btn { width: 32px; height: 32px; }
  }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div class="app">
  <header>
    <div>
      <h1>Grades<span>.</span></h1>
      <p class="sub">Add your subjects and see your average update instantly.</p>
    </div>
    <button class="ghost-btn" id="clear" type="button">Clear all</button>
  </header>

  <div class="grid">
    <div>
      <section class="panel" id="formPanel">
        <h2 id="formTitle">Add a subject</h2>
        <form id="form" novalidate autocomplete="off">
          <label>Subject
            <input id="name" type="text" maxlength="40" placeholder="e.g. Mathematics">
          </label>
          <div class="row">
            <label>Score (0–100)
              <input id="score" type="number" inputmode="decimal" min="0" max="100" step="any" placeholder="85">
            </label>
            <label>Weight (units)
              <input id="weight" type="number" inputmode="decimal" min="0.5" max="20" step="any" value="1">
            </label>
          </div>
          <p class="msg" id="msg" role="alert"></p>
          <button class="btn" type="submit"><span id="btnText">Add subject</span><i aria-hidden="true">+</i></button>
          <button class="cancel" id="cancel" type="button">Cancel editing</button>
        </form>
      </section>
    </div>

    <div>
      <section class="panel summary" aria-live="polite">
        <div class="ring">
          <svg viewBox="0 0 120 120" aria-hidden="true">
            <circle class="track" cx="60" cy="60" r="52"></circle>
            <circle class="bar" id="bar" cx="60" cy="60" r="52"></circle>
          </svg>
          <div class="ring-text"><b id="avg">–</b><span id="avgLabel">Average</span></div>
        </div>
        <div class="stats">
          <div class="stat"><small>Letter grade</small><b id="letter">–</b></div>
          <div class="stat"><small>Subjects</small><b id="count">0</b></div>
          <div class="stat"><small>Highest</small><b id="high">–</b></div>
          <div class="stat"><small>Lowest</small><b id="low">–</b></div>
        </div>
      </section>

      <section class="panel" style="margin-top:20px">
        <div class="list-head">
          <h2>Your subjects</h2>
          <select id="sort" aria-label="Sort subjects">
            <option value="added">Order added</option>
            <option value="high">Highest first</option>
            <option value="low">Lowest first</option>
            <option value="name">A to Z</option>
          </select>
        </div>
        <div class="list" id="list"></div>
      </section>
    </div>
  </div>
</div>

<script>
(function () {
  'use strict';
  var KEY = 'grades-app-v1';
  var items = [];
  var editId = null;

  var $ = function (id) { return document.getElementById(id); };
  var form = $('form'), nameEl = $('name'), scoreEl = $('score'), weightEl = $('weight');
  var msg = $('msg'), list = $('list'), sortEl = $('sort');

  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      var data = raw ? JSON.parse(raw) : [];
      if (Array.isArray(data)) items = data.filter(function (x) {
        return x && typeof x.name === 'string' && isFinite(x.score) && isFinite(x.weight);
      });
    } catch (e) { items = []; }
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(items)); } catch (e) { /* storage unavailable */ }
  }

  function letterFor(s) { return s >= 90 ? 'A' : s >= 80 ? 'B' : s >= 70 ? 'C' : s >= 60 ? 'D' : 'F'; }
  function tone(s) { return s >= 75 ? '' : s >= 60 ? 'warn' : 'bad'; }
  function fmt(n) { return (Math.round(n * 10) / 10).toString(); }
  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

  function flag(el, bad) { el.classList.toggle('bad', bad); }

  function resetForm() {
    editId = null;
    form.reset();
    weightEl.value = 1;
    $('formTitle').textContent = 'Add a subject';
    $('btnText').textContent = 'Add subject';
    $('formPanel').classList.remove('editing');
    msg.textContent = '';
    [nameEl, scoreEl, weightEl].forEach(function (el) { flag(el, false); });
  }

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var name = nameEl.value.trim();
    var score = parseFloat(scoreEl.value);
    var weight = parseFloat(weightEl.value);
    var badName = name.length < 1;
    var badScore = !isFinite(score) || score < 0 || score > 100;
    var badWeight = !isFinite(weight) || weight < 0.5 || weight > 20;
    flag(nameEl, badName); flag(scoreEl, badScore); flag(weightEl, badWeight);
    if (badName || badScore || badWeight) {
      msg.textContent = badName ? 'Please enter a subject name.'
        : badScore ? 'Score must be between 0 and 100.'
        : 'Weight must be between 0.5 and 20.';
      return;
    }
    if (editId) {
      items.forEach(function (it) { if (it.id === editId) { it.name = name; it.score = score; it.weight = weight; } });
    } else {
      items.push({ id: uid(), name: name, score: score, weight: weight });
    }
    save();
    resetForm();
    render();
    nameEl.focus();
  });

  $('cancel').addEventListener('click', resetForm);

  $('clear').addEventListener('click', function () {
    if (!items.length) return;
    if (window.confirm('Remove all subjects? This can’t be undone.')) {
      items = []; save(); resetForm(); render();
    }
  });

  sortEl.addEventListener('change', render);

  function icon(path) {
    var svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.setAttribute('viewBox', '0 0 24 24');
    svg.setAttribute('fill', 'none');
    svg.setAttribute('stroke', 'currentColor');
    svg.setAttribute('stroke-width', '2');
    svg.setAttribute('stroke-linecap', 'round');
    svg.setAttribute('stroke-linejoin', 'round');
    svg.setAttribute('aria-hidden', 'true');
    var p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    p.setAttribute('d', path);
    svg.appendChild(p);
    return svg;
  }

  function iconButton(label, path, cls, fn) {
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'icon-btn' + (cls ? ' ' + cls : '');
    b.setAttribute('aria-label', label);
    b.appendChild(icon(path));
    b.addEventListener('click', fn);
    return b;
  }

  function startEdit(it) {
    editId = it.id;
    nameEl.value = it.name;
    scoreEl.value = it.score;
    weightEl.value = it.weight;
    $('formTitle').textContent = 'Edit subject';
    $('btnText').textContent = 'Save changes';
    $('formPanel').classList.add('editing');
    msg.textContent = '';
    nameEl.focus();
    $('formPanel').scrollIntoView({ behavior: 'smooth', block: 'center' });
  }

  function sorted() {
    var arr = items.slice();
    var mode = sortEl.value;
    if (mode === 'high') arr.sort(function (a, b) { return b.score - a.score; });
    else if (mode === 'low') arr.sort(function (a, b) { return a.score - b.score; });
    else if (mode === 'name') arr.sort(function (a, b) { return a.name.localeCompare(b.name); });
    return arr;
  }

  function render() {
    list.textContent = '';
    if (!items.length) {
      var empty = document.createElement('div');
      empty.className = 'empty';
      empty.textContent = 'No subjects yet. Add your first one on the left.';
      list.appendChild(empty);
    }
    sorted().forEach(function (it) {
      var row = document.createElement('div');
      row.className = 'item';

      var letter = document.createElement('div');
      letter.className = 'letter ' + tone(it.score);
      letter.textContent = letterFor(it.score);

      var meta = document.createElement('div');
      meta.className = 'meta';
      var b = document.createElement('b');
      b.textContent = it.name;
      var small = document.createElement('small');
      small.textContent = 'Weight ' + fmt(it.weight) + (it.weight === 1 ? ' unit' : ' units');
      var line = document.createElement('div');
      line.className = 'barline';
      var fill = document.createElement('i');
      fill.className = tone(it.score);
      fill.style.width = Math.max(2, Math.min(100, it.score)) + '%';
      line.appendChild(fill);
      meta.appendChild(b); meta.appendChild(small); meta.appendChild(line);

      var side = document.createElement('div');
      side.className = 'side';
      var score = document.createElement('span');
      score.className = 'score';
      score.textContent = fmt(it.score);
      side.appendChild(score);
      side.appendChild(iconButton('Edit ' + it.name, 'M12 20h9M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z', '', function () { startEdit(it); }));
      side.appendChild(iconButton('Delete ' + it.name, 'M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14', 'del', function () {
        items = items.filter(function (x) { return x.id !== it.id; });
        if (editId === it.id) resetForm();
        save(); render();
      }));

      row.appendChild(letter); row.appendChild(meta); row.appendChild(side);
      list.appendChild(row);
    });
    summary();
  }

  function summary() {
    var bar = $('bar');
    $('count').textContent = items.length;
    if (!items.length) {
      $('avg').textContent = '–';
      $('letter').textContent = '–';
      $('high').textContent = '–';
      $('low').textContent = '–';
      bar.style.strokeDashoffset = 327;
      return;
    }
    var totalW = 0, total = 0, hi = items[0], lo = items[0];
    items.forEach(function (it) {
      totalW += it.weight; total += it.score * it.weight;
      if (it.score > hi.score) hi = it; if (it.score < lo.score) lo = it;
    });
    var avg = total / totalW;
    $('avg').textContent = fmt(avg);
    $('letter').textContent = letterFor(avg);
    $('high').textContent = hi.name + ' · ' + fmt(hi.score);
    $('low').textContent = lo.name + ' · ' + fmt(lo.score);
    bar.style.strokeDashoffset = 327 * (1 - Math.max(0, Math.min(100, avg)) / 100);
    bar.style.stroke = avg >= 75 ? '#a6ff00' : avg >= 60 ? '#ffc247' : '#ff6b5e';
  }

  load();
  render();
})();
</script>
</body>
</html>
